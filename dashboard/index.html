<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stiletto Vault — לוח שליטה</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808; --surface:#0f0f0f; --surface2:#141414; --border:#1e1e1e;
    --crimson:#8B0000; --gold:#B8860B; --gold-lt:#d4a843;
    --text:#d4cfc5; --muted:#726c64; --ok:#3a7d44; --warn:#8a6d1a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Crimson Pro',serif;
       font-size:16px;line-height:1.5;padding:24px;max-width:1200px;margin:0 auto}
  h1,h2{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.5px;margin:0}
  h1{font-size:26px;color:var(--gold-lt)}
  h2{font-size:16px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin:28px 0 12px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
  .kpi .n{font-family:'Cinzel',serif;font-size:30px;color:var(--gold-lt);font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
  .kpi .na{font-size:15px;color:var(--muted);font-style:italic}
  /* funnel */
  .funnel{display:flex;gap:8px;flex-wrap:wrap}
  .step{flex:1;min-width:120px;background:var(--surface2);border:1px solid var(--border);
        border-radius:8px;padding:14px;text-align:center;position:relative}
  .step .n{font-family:'Cinzel',serif;font-size:28px;color:var(--gold-lt);font-weight:700}
  .step .l{color:var(--muted);font-size:12px;margin-top:4px}
  .step .pct{color:var(--crimson);font-size:12px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--gold);font-family:'Cinzel',serif;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  tr:hover td{background:var(--surface2)}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;border:1px solid}
  .b-published{color:var(--gold-lt);border-color:var(--gold)}
  .b-produced{color:#7fb87f;border-color:var(--ok)}
  .b-approved{color:var(--muted);border-color:var(--border)}
  .price{color:var(--gold-lt);font-weight:600}
  .was{color:var(--muted);text-decoration:line-through;font-size:12px;margin-inline-start:5px}
  .src{font-size:12px;color:var(--muted);font-style:italic}
  .src.on{color:var(--ok);font-style:normal}
  a{color:var(--gold-lt)}
  .scroll{overflow-x:auto}
  .foot{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
</style>
</head>
<body>
  <h1>🖤 Stiletto Vault — לוח שליטה</h1>
  <div class="sub" id="stamp">טוען…</div>

  <h2>משפך ייצור</h2>
  <div class="funnel" id="funnel"></div>

  <h2>מדדים</h2>
  <div class="grid kpis" id="kpis"></div>

  <h2>נעליים</h2>
  <div class="card scroll"><table id="shoes"><thead><tr>
    <th>נעל</th><th>סטטוס</th><th>מחיר</th><th>הנחה</th><th>נמכר</th><th>קליקים</th><th>מכירות</th><th>לינק</th>
  </tr></thead><tbody></tbody></table></div>

  <h2>לוז פרסום</h2>
  <div class="card scroll"><table id="sched"><thead><tr>
    <th>#</th><th>תאריך</th><th>יום</th><th>מוצר</th><th>מקור</th><th>סטטוס</th>
  </tr></thead><tbody></tbody></table></div>

  <div class="foot" id="foot"></div>

<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const na='<span class="na">— לא זמין —</span>';

fetch('./data.json?cb='+Date.now()).then(r=>r.json()).then(render).catch(e=>{
  $('#stamp').textContent='שגיאה בטעינת data.json: '+e;
});

function render(d){
  const t=new Date(d.generated_at);
  $('#stamp').textContent='עודכן: '+t.toLocaleString('he-IL');

  // funnel
  const f=d.funnel, steps=[['נסרקו','scanned'],['אושרו','approved'],['הופקו','produced'],['שובצו','scheduled'],['פורסמו','published']];
  $('#funnel').innerHTML=steps.map(([l,k],i)=>{
    const n=f[k]??0, base=f.scanned||f.approved||1;
    const pct=i>0?Math.round(100*n/(f[steps[0][1]]||base)):100;
    return `<div class="step"><div class="n">${n}</div><div class="l">${l}</div>${i>0?`<div class="pct">${pct}%</div>`:''}</div>`;
  }).join('');

  // kpis: sales / revenue / traffic / followers
  const s=d.sales||{}, tr=d.traffic||{}, fo=d.followers||{};
  const kpi=(n,l,ok)=>`<div class="card kpi"><div class="${ok?'n':'na'}">${ok?n:'—'}</div><div class="l">${l}</div></div>`;
  const salesOK=s.source_status&&s.source_status!=='unavailable';
  const trafOK=tr.source_status&&tr.source_status!=='unavailable';
  const foOK=fo.source_status&&fo.source_status!=='unavailable';
  $('#kpis').innerHTML=[
    kpi(s.total_sales??0,'מכירות',salesOK),
    kpi('$'+(s.total_revenue??0),'הכנסה',salesOK),
    kpi(tr.visitors??'—','מבקרים',trafOK),
    kpi(tr.clicks??'—','קליקים',trafOK),
    kpi(fo.instagram??'—','עוקבי IG',foOK),
    kpi(fo.tiktok??'—','עוקבי TikTok',foOK),
  ].join('')
   + `<div class="card" style="grid-column:1/-1"><div class="src ${salesOK?'on':''}">מכירות: ${esc(s.source_status||'—')}${s.note?' ('+esc(s.note)+')':''}</div>
      <div class="src ${trafOK?'on':''}">תנועה: ${esc(tr.source_status||'—')}</div>
      <div class="src ${foOK?'on':''}">עוקבים: ${esc(fo.source_status||'—')}</div></div>`;

  // shoes
  $('#shoes tbody').innerHTML=(d.shoes||[]).map(sh=>`<tr>
    <td>${esc(sh.name)}</td>
    <td><span class="badge b-${sh.status}">${({published:'פורסם',produced:'הופק',approved:'אושר'})[sh.status]||sh.status}</span></td>
    <td class="price">${esc(sh.price)}${sh.was?`<span class="was">${esc(sh.was)}</span>`:''}</td>
    <td>${esc(sh.discount)}</td>
    <td class="src">${esc(sh.sold)}</td>
    <td>${sh.clicks??'—'}</td>
    <td>${sh.sales??'—'}</td>
    <td>${sh.aff_link?`<a href="${esc(sh.aff_link)}" target="_blank">↗</a>`:''}</td>
  </tr>`).join('');

  // schedule (upcoming first)
  $('#sched tbody').innerHTML=(d.schedule||[]).map(r=>`<tr>
    <td>${r.n}</td><td>${esc(r.date)}</td><td>${esc(r.day)}</td>
    <td>${esc(r.product)}</td><td>${esc(r.source)}</td><td class="src">${esc(r.status)}</td>
  </tr>`).join('');

  $('#foot').textContent=`${d.shoes.length} נעליים · ${d.schedule.length} שיבוצים · רענון: py collect_metrics.py --push`;
}
</script>
</body>
</html>
